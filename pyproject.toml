[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = '''
/(\.git|\.venv|\.shanks|graphify-out|scripts/ralph/archive)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".git", ".venv", ".shanks", "graphify-out", "scripts/ralph/archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = [
    "graph.py",
    "scripts/quality_gates.py",
    "scripts/sync_tests_md.py",
    "workflow/adapters.py",
    "workflow/cli.py",
    "workflow/contracts.py",
    "workflow/lifecycle.py",
    "workflow/nodes.py",
    "workflow/retries.py",
    "workflow/state.py",
    "workflow/workspaces.py",
]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true
