name: Tests

on:
  # `push` is filtered to `main` so a branch with an open PR does not run this
  # workflow twice for one push - an unfiltered `push` plus `pull_request` fires
  # both, which cost four jobs per push once the macOS half of the matrix landed.
  # `main` still gets covered here (that is where merges land), every PR branch
  # by `pull_request`. The trade is no CI on a branch pushed without a PR.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    # Both platforms, because the guardrail layer is shell: the eight
    # `hooks/test.hooks/*.sh` harnesses lean on tools that differ between BSD
    # and GNU userland, and #106 shipped a Linux-only `stat` bug that passed
    # locally on macOS and was caught only because CI happened to be the other
    # platform. A macOS-only regression had nothing watching it at all - and
    # `tests/test_sandbox_claude.py` skips itself off macOS, so its four
    # containment checks never ran in CI before this.
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the other: which platforms fail is
      # the whole diagnostic here.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install quality-gate dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          set -euo pipefail
          # Pinned and checksum-verified on both platforms rather than
          # `brew install` on macOS: `workflow/cli.py`'s `_MIN_TOOL_VERSIONS`
          # floor tracks this single version, and
          # `test_doctor_gitleaks_floor_matches_the_ci_pin` reads it back out
          # of this file expecting exactly one pin.
          if [ "${{ runner.os }}" = "macOS" ]; then
            asset="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
            verify="shasum -a 256 -c -"
          else
            asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            verify="sha256sum -c -"
          fi
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSL -o "$asset" "${base_url}/${asset}"
          curl -sSL -o checksums.txt "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${asset}\$" checksums.txt | $verify
          # /usr/local/bin is not guaranteed to exist on the arm64 macOS runner.
          sudo mkdir -p /usr/local/bin
          sudo tar -xz -C /usr/local/bin -f "$asset" gitleaks
          gitleaks version

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run hook guard harnesses
        run: |
          bash hooks/test.hooks/test-deny-dangerous.sh
          bash hooks/test.hooks/test-secret-scan.sh
          bash hooks/test.hooks/test-guard-worktree.sh
          bash hooks/test.hooks/test-pre-push.sh
          bash hooks/test.hooks/test-run-impacted-tests.sh
          bash hooks/test.hooks/test-format-touched.sh
          bash hooks/test.hooks/test-post-merge-checkout.sh
          bash hooks/test.hooks/test-prompt-repo-state.sh

      - name: Run quality gates
        # Linux only: black/ruff/mypy/pip-audit are pure Python with nothing
        # platform-dependent to catch, and macOS runner minutes bill at a
        # multiple of Linux ones.
        if: runner.os == 'Linux'
        run: python scripts/quality_gates.py --diff-base origin/main
