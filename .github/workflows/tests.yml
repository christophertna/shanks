name: Tests

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install quality-gate dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run hook guard harnesses
        run: |
          bash hooks/test-guard.sh
          bash hooks/test-secret-scan.sh

      - name: Run quality gates
        run: python scripts/quality_gates.py --diff-base origin/main
