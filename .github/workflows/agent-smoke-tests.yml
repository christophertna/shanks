name: Agent smoke tests

# Opt-in, manually-triggered real-CLI smoke tests (tests/test_agent_integration.py).
# Requires the ANTHROPIC_API_KEY and OPENAI_API_KEY repository secrets to be
# configured first, scoped to this job only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHANKS_RUN_AGENT_SMOKE: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code and Codex CLIs
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex
          claude --version
          codex --version

      - name: Run real-agent smoke tests
        run: python -m unittest tests.test_agent_integration -v
