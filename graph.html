<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LangGraph Viewer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 2.5rem 1.5rem 4rem;
        background: #f8fafc;
        color: #111827;
      }

      main {
        max-width: 1280px;
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.25rem;
      }

      h1 {
        margin: 0;
        color: #0f172a;
        font-size: clamp(1.75rem, 3vw, 2.5rem);
        letter-spacing: -0.04em;
      }

      .subtitle {
        margin: 0.45rem 0 0;
        color: #64748b;
        font-size: 0.98rem;
      }

      #status {
        flex: 0 0 auto;
        margin: 0;
        padding: 0.45rem 0.7rem;
        border: 1px solid #cbd5e1;
        border-radius: 999px;
        background: #ffffff;
        color: #475569;
        font-size: 0.78rem;
        white-space: nowrap;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1rem;
        padding: 0.85rem 1rem;
        border: 1px solid #e2e8f0;
        border-radius: 0.9rem;
        background: #ffffff;
        box-shadow: 0 8px 24px rgb(15 23 42 / 5%);
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        color: #334155;
        cursor: pointer;
        font-size: 0.88rem;
        font-weight: 650;
      }

      .toggle input {
        width: 1rem;
        height: 1rem;
        accent-color: #2563eb;
      }

      .legend {
        display: inline-flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.85rem;
        color: #64748b;
        font-size: 0.78rem;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }

      .legend-line {
        display: inline-block;
        width: 1.35rem;
        border-top: 2px solid #2563eb;
      }

      .legend-line.dashed {
        border-top-style: dashed;
        border-top-color: #9333ea;
      }

      .graph-shell {
        min-height: 430px;
        padding: 1.25rem 1rem 1.5rem;
        overflow: hidden;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: 0 16px 40px rgb(15 23 42 / 7%);
      }

      #diagram {
        overflow-x: auto;
        text-align: center;
      }

      #diagram svg {
        display: inline-block;
        width: 100%;
        max-width: 100%;
        height: auto;
      }

      #diagram svg .node foreignObject,
      #diagram svg .node foreignObject > div,
      #diagram svg .node .nodeLabel,
      #diagram svg .node .nodeLabel p {
        max-width: none !important;
        overflow: visible !important;
        white-space: nowrap !important;
      }

      #diagram svg .node .nodeLabel p {
        margin: 0;
      }

      #diagram svg .node rect {
        rx: 12px;
        ry: 12px;
      }

      #diagram svg .node .nodeLabel {
        font-weight: 650;
      }

      #diagram svg .cluster rect {
        fill: #f8fafc !important;
        stroke: #cbd5e1 !important;
        stroke-dasharray: 5 4;
      }

      #diagram svg .cluster-label {
        color: #475569 !important;
        fill: #475569 !important;
        font-size: 14px;
        font-weight: 700;
      }

      #diagram svg .edgeLabel rect {
        fill: #ffffff !important;
        opacity: 0.95;
      }

      @media (max-width: 760px) {
        body {
          padding: 1.25rem 0.75rem 2rem;
        }

        header,
        .toolbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .legend {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>LangGraph workflow</h1>
          <p class="subtitle">A clear view of the main execution path and its recovery loops.</p>
        </div>
        <div id="status" role="status">Loading graph…</div>
      </header>

      <section class="toolbar" aria-label="Graph controls and legend">
        <label class="toggle">
          <input id="details-toggle" type="checkbox" />
          Show recovery and safety paths
        </label>
        <div class="legend" aria-label="Graph legend">
          <span class="legend-item"><span class="legend-line"></span>Main flow</span>
          <span class="legend-item"><span class="legend-line dashed"></span>Recovery / safety</span>
        </div>
      </section>

      <section class="graph-shell">
        <div id="diagram" aria-live="polite"></div>
      </section>
    </main>

    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

      const status = document.getElementById("status");
      const diagram = document.getElementById("diagram");
      const detailsToggle = document.getElementById("details-toggle");
      let lastDefinition = "";

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "loose",
        theme: "base",
        flowchart: {
          curve: "basis",
          htmlLabels: true,
          nodeSpacing: 54,
          rankSpacing: 88,
          useMaxWidth: false,
        },
        themeVariables: {
          background: "#ffffff",
          primaryTextColor: "#111827",
          primaryBorderColor: "#1e293b",
          lineColor: "#64748b",
          edgeLabelBackground: "#ffffff",
          nodeBorder: "#1e293b",
          textColor: "#111827",
        },
      });

      async function refreshGraph() {
        try {
          const mode = detailsToggle.checked ? "detail" : "overview";
          const response = await fetch(`/graph.mmd?mode=${mode}&ts=${Date.now()}`);
          const definition = await response.text();

          if (!response.ok) {
            throw new Error(definition);
          }

          if (definition !== lastDefinition) {
            const renderId = `langgraph-${Date.now()}`;
            const rendered = await mermaid.render(renderId, definition);
            diagram.innerHTML = rendered.svg;
            lastDefinition = definition;
          }

          status.textContent = detailsToggle.checked
            ? `Detailed view · updated ${new Date().toLocaleTimeString()}`
            : `Overview · updated ${new Date().toLocaleTimeString()}`;
        } catch (error) {
          status.textContent = `Could not load graph sources: ${error.message}`;
        }
      }

      const graphEvents = new EventSource("/graph-events");
      graphEvents.addEventListener("open", () => {
        lastDefinition = "";
        refreshGraph();
      });
      graphEvents.addEventListener("graph-changed", () => {
        status.textContent = "Graph source changed · updating graph…";
        refreshGraph();
      });
      graphEvents.onerror = () => {
        status.textContent = "Waiting for the graph.py watcher to reconnect…";
      };

      detailsToggle.addEventListener("change", () => {
        lastDefinition = "";
        refreshGraph();
      });

      refreshGraph();
    </script>
  </body>
</html>
